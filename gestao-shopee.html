        <div style="background:var(--s2);border-radius:10px;padding:12px">
          <div style="font-size:10px;color:var(--t2);margin-bottom:4px">Despesas</div>
          <div class="fw8 c-rd" style="font-size:14px">${R$(f.despTotal)}</div>
          <div style="font-size:10px;color:var(--t2)">vs ${R$(f.lucroAnt+f.despTotal>0?f.lucroAnt+f.despTotal:0)}</div>
          <div style="font-size:11px;font-weight:700;color:var(--t2)">—</div>
        </div>
        <div style="background:var(--s2);border-radius:10px;padding:12px">
          <div style="font-size:10px;color:var(--t2);margin-bottom:4px">Lucro</div>
          <div class="fw8" style="font-size:14px;color:${f.lucro>=0?'var(--gn)':'var(--rd)'}">${R$(f.lucro)}</div>
          <div style="font-size:10px;color:var(--t2)">vs ${R$(f.lucroAnt)}</div>
          <div style="font-size:11px;font-weight:700;color:${f.lucro>=f.lucroAnt?'var(--gn)':'var(--rd)'}">${f.lucroAnt!==0?((f.lucro-f.lucroAnt)/Math.abs(f.lucroAnt)*100).toFixed(1)+'%':'—'}</div>
        </div>
      </div>
    </div>`:''}

    <!-- Histórico rotas encerradas -->
    ${(()=>{
      const enc=rotas.filter(r=>r.dataFim);
      if(!enc.length) return '';
      return enc.map(r=>{
        const todos=DB.semanas.filter(s=>s.rotaId===r.nome);
        if(!todos.length) return '';
        const recT   = todos.reduce((a,s)=>a+(+s.total||0),0);
        const pktsT  = todos.reduce((a,s)=>a+(+s.pkts||0),0);
        const diasT  = todos.reduce((a,s)=>a+(+s.dias||0),0);
        const motT   = todos.reduce((a,s)=>a+(+s.custoMot||0),0);
        const pedT   = todos.reduce((a,s)=>a+(+s.pedPago||0),0);
        const semanas= todos.length;
        // Variáveis lançadas no período
        const varsPeriodo = DB.variaveis.filter(v=>{
          if(!r.dataInicio||!r.dataFim) return false;
          return v.data>=r.dataInicio && v.data<=r.dataFim;
        });
        const varT = varsPeriodo.reduce((a,v)=>a+(+v.valor||0),0);
        // Fixas proporcionais pelo período
        const pts=r.dataInicio?r.dataInicio.split('-'):[];
        const ptf=r.dataFim?r.dataFim.split('-'):[];
        const dInicio=r.dataInicio?new Date(r.dataInicio+'T12:00:00'):null;
        const dFim=r.dataFim?new Date(r.dataFim+'T12:00:00'):null;
        const diasCorridos=dInicio&&dFim?Math.round((dFim-dInicio)/86400000)+1:0;
        const mesesOp=diasCorridos/30;
        const fixaMensal=(+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
        const fixasT=fixaMensal*mesesOp;
        const despT=motT+pedT+varT+fixasT;
        const lucroT=recT-despT;
        const margem=recT>0?(lucroT/recT)*100:0;
        const recMedia=semanas>0?recT/semanas:0;
        const lucMedia=semanas>0?lucroT/semanas:0;
        return `<div class="card" style="border-left:3px solid var(--t2);margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <div>
              <div class="fw8 ff" style="font-size:16px">${r.icone||'🗺️'} ${r.nome} <span style="font-size:11px;background:var(--bd);padding:3px 8px;border-radius:99px;font-weight:600;color:var(--t2)">ENCERRADA</span></div>
              <div style="font-size:12px;color:var(--t2);margin-top:3px">${r.dataInicio||'—'} até ${r.dataFim||'—'} · ${semanas} semanas · ${diasT} dias trabalhados</div>
            </div>
            <div style="text-align:right">
              <div class="fw8" style="font-size:18px;color:${lucroT>=0?'var(--gn)':'var(--rd)'}">${R$(lucroT)}</div>
              <div style="font-size:11px;color:var(--t2)">lucro total · margem ${margem.toFixed(1)}%</div>
            </div>
          </div>

          <!-- KPIs resumo -->
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px">
            <div style="background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.15);border-radius:10px;padding:10px;text-align:center">
              <div style="font-size:10px;color:var(--t2);margin-bottom:3px">Receita total</div>
              <div class="fw8 c-gn" style="font-size:16px">${R$(recT)}</div>
              <div style="font-size:10px;color:var(--t2)">${R$(recMedia)}/sem média</div>
            </div>
            <div style="background:rgba(244,63,94,.07);border:1px solid rgba(244,63,94,.15);border-radius:10px;padding:10px;text-align:center">
              <div style="font-size:10px;color:var(--t2);margin-bottom:3px">Despesas total</div>
              <div class="fw8 c-rd" style="font-size:16px">${R$(despT)}</div>
              <div style="font-size:10px;color:var(--t2)">aprox. ${diasCorridos} dias corridos</div>
            </div>
            <div style="background:${lucroT>=0?'rgba(52,211,153,.07)':'rgba(244,63,94,.07)'};border:1px solid ${lucroT>=0?'rgba(52,211,153,.15)':'rgba(244,63,94,.15)'};border-radius:10px;padding:10px;text-align:center">
              <div style="font-size:10px;color:var(--t2);margin-bottom:3px">Lucro total</div>
              <div class="fw8" style="font-size:16px;color:${lucroT>=0?'var(--gn)':'var(--rd)'}">${R$(lucroT)}</div>
              <div style="font-size:10px;color:var(--t2)">${R$(lucMedia)}/sem média</div>
            </div>
            <div style="background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.15);border-radius:10px;padding:10px;text-align:center">
              <div style="font-size:10px;color:var(--t2);margin-bottom:3px">Pacotes</div>
              <div class="fw8 c-ac" style="font-size:16px">${pktsT.toLocaleString('pt-BR')}</div>
              <div style="font-size:10px;color:var(--t2)">${diasT} dias trabalhados</div>
            </div>
          </div>

          <!-- Breakdown despesas -->
          <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Composição das despesas</div>
          <div class="row"><span class="rl">👥 Custo motorista/equipe</span><span class="rv c-bl">${R$(motT)}</span></div>
          <div class="row"><span class="rl">🛣️ Pedágio gasto</span><span class="rv c-rd">${R$(pedT)}</span></div>
          ${varT>0?`<div class="row"><span class="rl">📌 Despesas variáveis (período)</span><span class="rv c-rd">${R$(varT)}</span></div>`:''}
          <div class="row"><span class="rl">📋 Fixas proporcionais (~${mesesOp.toFixed(1)} meses)</span><span class="rv c-rd">${R$(fixasT)}</span></div>

          <!-- Semanas -->
          <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px">Lançamentos semanais</div>
          ${[...todos].sort((a,b)=>a.data>b.data?1:-1).map((s,i)=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px">
              <div>
                <span style="color:var(--t2)">Sem ${i+1} · ${s.data} · ${s.dias}d</span>
                <span style="color:var(--t2);margin-left:8px">📦 ${(+s.pkts||0).toLocaleString('pt-BR')} pkts</span>
              </div>
              <span class="fw8 c-gn">${R$(s.total)}</span>
            </div>`).join('')}
        </div>`;
      }).join('');
    })()}

    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn bgh" onclick="gerarPDF()">📄 Exportar PDF</button>
    </div>`;
}


function modalEditCal(){

  const items=[];
  if(+c.financiamento>0) items.push({key:'parcela_caminhao',desc:'🚛 Parcela caminhão',dia:cal.parcela_caminhao||10});
  if(+c.seguro>0) items.push({key:'seguro_mensal',desc:'🛡️ Seguro',dia:cal.seguro_mensal||15});
  (c.fixasExtras||[]).forEach((f,i)=>items.push({key:'fixa_'+i,desc:'📋 '+f.nome,dia:cal['fixa_'+i]||10}));
  return `
    <div class="mh"><span class="mt">✏️ Datas de Vencimento</span><button class="mc" onclick="closeModal()">×</button></div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:16px;line-height:1.5">
      Configure o dia do mês em que cada conta vence para gerar alertas no momento certo.
    </div>
    ${items.length===0?'<div style="color:var(--t2);font-size:13px;text-align:center;padding:12px">Nenhuma despesa fixa configurada ainda.<br>Adicione em ⚙️ Config.</div>':''}
    ${items.map(item=>`
      <div class="fld">
        <label class="lbl">${item.desc}</label>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;color:var(--t2)">Vence todo dia</span>
          <input class="inp" type="number" id="cal-${item.key}" min="1" max="31" value="${item.dia}"
            style="width:70px;text-align:center;font-size:18px;font-weight:700">
          <span style="font-size:13px;color:var(--t2)">do mês</span>
        </div>
      </div>`).join('')}
    ${rotas.map(rota=>(rota.equipe||[]).filter(m=>m.tipo==='fixo_mensal').map(m=>`
      <div style="background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:12px;margin-bottom:10px">
        <div style="font-size:12px;font-weight:700;color:var(--bl);margin-bottom:10px">💰 ${m.nome} — ${rota.nome}</div>
        <div class="inp-row">
          <div class="fld"><label class="lbl">1ª parcela — dia</label>
            <input class="inp" type="number" id="eq-p1d-${m.nome.replace(/\s/g,'_')}" min="1" max="31" value="${m.pag1Dia||5}" style="text-align:center;font-weight:700">
          </div>
          <div class="fld"><label class="lbl">Valor (R$)</label>
            <input class="inp" type="number" id="eq-p1v-${m.nome.replace(/\s/g,'_')}" value="${m.pag1Val||0}">
          </div>
        </div>
        <div class="inp-row">
          <div class="fld"><label class="lbl">2ª parcela — dia</label>
            <input class="inp" type="number" id="eq-p2d-${m.nome.replace(/\s/g,'_')}" min="1" max="31" value="${m.pag2Dia||20}" style="text-align:center;font-weight:700">
          </div>
          <div class="fld"><label class="lbl">Valor (R$)</label>
            <input class="inp" type="number" id="eq-p2v-${m.nome.replace(/\s/g,'_')}" value="${m.pag2Val||0}">
          </div>
        </div>
      </div>`).join('')).join('')}
    <button class="btn" onclick="saveCalDatas()">💾 Salvar datas</button>`;
}

window.saveCalDatas=function(){
  if(!DB.cfg.calDatas) DB.cfg.calDatas={};
  const c=DB.cfg, rotas=c.rotas||[];
  if(+c.financiamento>0){ const el=document.getElementById('cal-parcela_caminhao'); if(el) DB.cfg.calDatas.parcela_caminhao=+el.value||10; }
  if(+c.seguro>0){ const el=document.getElementById('cal-seguro_mensal'); if(el) DB.cfg.calDatas.seguro_mensal=+el.value||15; }
  (c.fixasExtras||[]).forEach((f,i)=>{ const el=document.getElementById('cal-fixa_'+i); if(el) DB.cfg.calDatas['fixa_'+i]=+el.value||10; });
  rotas.forEach(rota=>{
    (rota.equipe||[]).filter(m=>m.tipo==='fixo_mensal').forEach(m=>{
      const key=m.nome.replace(/\s/g,'_');
      const p1d=document.getElementById('eq-p1d-'+key);
      const p1v=document.getElementById('eq-p1v-'+key);
      const p2d=document.getElementById('eq-p2d-'+key);
      const p2v=document.getElementById('eq-p2v-'+key);
      if(p1d) m.pag1Dia=+p1d.value||5;
      if(p1v) m.pag1Val=+p1v.value||0;
      if(p2d) m.pag2Dia=+p2d.value||20;
      if(p2v) m.pag2Val=+p2v.value||0;
    });
  });
  save(); closeModal(); render();
  showToast('✅ Datas salvas!');
};

function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c1f27;color:#eef0f4;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:2000;border:1px solid #272b36;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function empty(t){ return `<div class="empty"><div style="font-size:44px;margin-bottom:10px">📭</div><p style="font-size:14px">${t}</p></div>`; }
window.render=function render(){
  const c=document.getElementById('cnt'); if(!c)return;
  if(TAB==='dash') c.innerHTML=renderDash();
  if(TAB==='ent')  c.innerHTML=renderEnt();
  if(TAB==='desp') c.innerHTML=renderDesp();
  if(TAB==='anal') {
    c.innerHTML=renderAnal();
    setTimeout(function(){ if(window.calcSim) window.calcSim(); }, 100);
    setTimeout(function(){
      var el=document.getElementById('c1-fixo');
      if(el && window.calcMulti) window.calcMulti();
    }, 600);
  }
  if(TAB==='fin')  c.innerHTML=renderFin();
