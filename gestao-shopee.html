<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Gestão Shopee VUC</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0f13;--sf:#1c1f27;--s2:#21252e;--bd:#272b36;--tx:#eef0f4;--t2:#7a8294;--ac:#f05a28;--gn:#34d399;--rd:#f43f5e;--yw:#fbbf24;--bl:#60a5fa}
.light{--bg:#f0f4f8;--sf:#fff;--s2:#f8fafc;--bd:#e2e8f0;--tx:#1a202c;--t2:#64748b;--gn:#16a34a;--rd:#e11d48;--yw:#d97706;--bl:#2563eb}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--tx);min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--ac)!important;outline:none}

/* ── LOGIN ──────────────────────────────────────────────────────── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px}
.login-logo{width:88px;height:88px;border-radius:24px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:24px;box-shadow:0 16px 40px rgba(240,90,40,.35)}
.login-title{font-size:28px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx);text-align:center;margin-bottom:8px}
.login-sub{font-size:14px;color:var(--t2);text-align:center;margin-bottom:40px;line-height:1.6;max-width:300px}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#1a202c;border:none;border-radius:14px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.15);transition:.2s;width:100%;max-width:300px;justify-content:center}
.google-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.22)}
.login-version{font-size:11px;color:var(--t2);margin-top:32px}

/* ── LAYOUT DESKTOP ─────────────────────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}
#app.visible{display:flex}

/* Sidebar (desktop) */
#sidebar{display:none;width:240px;min-height:100vh;background:var(--sf);border-right:1px solid var(--bd);flex-direction:column;position:fixed;top:0;left:0;z-index:100;padding:0}
.sb-header{padding:20px 20px 16px;border-bottom:1px solid var(--bd)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sb-logo-box{width:36px;height:36px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sb-logo-tx{font-size:13px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx);line-height:1.2}
.sb-logo-sb{font-size:10px;color:var(--t2)}
.sb-user{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--s2);border-radius:10px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-uname{font-size:12px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-uemail{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{padding:12px 12px;flex:1}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;color:var(--t2);font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.15s}
.sb-nav-item:hover{background:var(--s2);color:var(--tx)}
.sb-nav-item.active{background:rgba(240,90,40,.12);color:var(--ac)}
.sb-nav-icon{font-size:18px;flex-shrink:0}
.sb-bottom{padding:12px;border-top:1px solid var(--bd)}
.sb-signout{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;border:none;background:none;width:100%;color:var(--t2);font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.15s}
.sb-signout:hover{background:rgba(244,63,94,.08);color:var(--rd)}

/* Main content area */
#main-wrap{display:flex;flex:1;min-height:100vh}
#content-area{flex:1;padding:24px;overflow-y:auto;min-height:100vh}

/* Mobile header */
#mob-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:200;backdrop-filter:blur(12px)}
.light #mob-hdr{background:rgba(255,255,255,.96)}
.mob-logo{display:flex;align-items:center;gap:8px}
.mob-logo-box{width:34px;height:34px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:18px}
.mob-logo-tx{font-size:14px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx)}
.mob-logo-sb{font-size:10px;color:var(--t2)}
.mob-actions{display:flex;gap:8px;align-items:center}
.icon-btn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:16px;color:var(--tx)}

/* Bottom nav (mobile) */
#mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(28,31,39,.97);backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:200}
.light #mob-nav{background:rgba(255,255,255,.97)}
.nb{flex:1;padding:9px 4px 11px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2.5px solid transparent;color:var(--t2);transition:.15s}
.nb.active{border-color:var(--ac);color:var(--ac)}
.ni{font-size:20px;line-height:1}.nl{font-size:10px;font-weight:600;font-family:'Sora',sans-serif;letter-spacing:.03em}

/* Desktop show/hide */
@media(min-width:768px){
  #sidebar{display:flex}
  #mob-hdr{display:none}
  #mob-nav{display:none}
  #content-area{margin-left:240px;padding:28px 32px;padding-bottom:28px}
  #cnt{max-width:1100px;margin:0 auto}
}
@media(max-width:767px){
  #content-area{padding:16px 14px 90px}
}

/* ── CARDS ──────────────────────────────────────────────────────── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
.ct{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;border-left:3px solid}
.ki{font-size:22px;margin-bottom:6px}
.kl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.kv{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;margin:5px 0 3px;line-height:1.2}
.ks{font-size:10px;color:var(--t2)}

/* 2-col desktop layout */
.two-col{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:768px){.two-col{grid-template-columns:1fr 1fr}}

/* Buttons */
.btn{background:var(--ac);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sora',sans-serif;width:100%;transition:.15s}
.btn:active{opacity:.8}
.bsm{padding:8px 16px;font-size:12px;border-radius:8px;width:auto}
.brd{background:var(--rd)}.bgh{background:var(--s2);color:var(--tx);border:1.5px solid var(--bd)}

/* Rows / items */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.rl{font-size:13px;color:var(--t2)}.rv{font-size:13px;font-weight:700;color:var(--tx)}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 14px;border-radius:10px;margin-bottom:8px;background:var(--s2);border:1px solid var(--bd)}
.itx{font-size:13px;font-weight:600;color:var(--tx)}.isb{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.5}

/* Form */
.fld{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;padding:11px 13px;border-radius:10px;font-size:14px;background:var(--s2);border:1.5px solid var(--bd);color:var(--tx);font-family:'DM Sans',sans-serif}
.inp-row{display:flex;gap:10px}
.inp-row .fld{flex:1;margin-bottom:0}

/* Days picker */
.days-pick{display:flex;gap:6px;margin-top:4px}
.day-btn{flex:1;padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;font-size:12px;font-weight:600;font-family:'Sora',sans-serif;text-align:center;transition:.15s}
.day-btn.on{border-color:var(--ac);background:rgba(240,90,40,.12);color:var(--ac);font-weight:700}

/* Modal */
#ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
#ov.open{display:flex}
@media(min-width:768px){#ov{align-items:center}}
#mb{background:var(--sf);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:8px 0 0;width:100%;max-width:520px;max-height:93vh;overflow-y:auto;animation:up .25s cubic-bezier(.4,0,.2,1)}
@media(min-width:768px){#mb{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.drag{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 16px}
@media(min-width:768px){.drag{display:none}}
.mi{padding:0 22px 32px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mt{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx)}
.mc{background:var(--s2);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--t2);display:flex;align-items:center;justify-content:center}

/* Calc box */
.cbox{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.crow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--t2)}
.crow b{color:var(--tx)}
.ctot{border-top:1px solid var(--bd);margin-top:6px;padding-top:10px;font-weight:800;font-size:14px;color:var(--tx)}

/* Charts */
.chw{display:flex;align-items:flex-end;gap:6px;height:64px}
.cbw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.cb{width:100%;border-radius:4px;background:var(--ac);transition:height .5s cubic-bezier(.4,0,.2,1)}
.clb{font-size:9px;color:var(--t2)}
@media(min-width:768px){.chw{height:80px}}

/* Alerts */
.alrt{border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}
.aicon{font-size:20px;flex-shrink:0;margin-top:1px}
.atitle{font-size:13px;font-weight:700}.asub{font-size:11px;margin-top:2px;opacity:.85}
.a-or{background:rgba(240,90,40,.1);border:1px solid rgba(240,90,40,.25);color:var(--ac)}
.a-rd{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:var(--rd)}
.a-yw{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:var(--yw)}
.a-bl{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);color:var(--bl)}

/* Toggle */
.trow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}
.trow:last-child{border-bottom:none}
.tog{position:relative;width:44px;height:24px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.sldr{position:absolute;cursor:pointer;inset:0;background:var(--bd);border-radius:99px;transition:.3s}
.sldr:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.sldr{background:var(--ac)}
input:checked+.sldr:before{transform:translateX(20px)}

/* Proj bar */
.pbg{background:var(--bd);border-radius:99px;height:8px;overflow:hidden;margin:8px 0 4px}
.pfill{height:100%;border-radius:99px;background:var(--ac);transition:width .6s}

/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--gn);display:inline-block;margin-right:4px}
.sync-dot.syncing{background:var(--yw);animation:pulse 1s infinite}
.sync-dot.error{background:var(--rd)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Colors */
.c-gn{color:var(--gn)}.c-rd{color:var(--rd)}.c-yw{color:var(--yw)}.c-ac{color:var(--ac)}.c-bl{color:var(--bl)}
.fw8{font-weight:800}.ff{font-family:'Sora',sans-serif}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.st{font-size:20px;font-weight:800;font-family:'Sora',sans-serif;color:var(--tx)}
.del{background:none;border:none;cursor:pointer;font-size:16px;color:var(--rd);padding:4px;flex-shrink:0}
.nfe-box{background:rgba(240,90,40,.07);border:1px solid rgba(240,90,40,.22);border-radius:16px;padding:16px;margin-bottom:16px}
.light .nfe-box{background:#fff5f0;border-color:#fcd9c8}
.empty{text-align:center;padding:48px 20px;color:var(--t2)}
.divider{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}

/* Loading */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--t2);font-family:'Sora',sans-serif">Carregando...</div>
</div>

<!-- Login -->
<div id="login-screen" style="display:none">
  <div class="login-logo">🚛</div>
  <div class="login-title">Gestão Shopee VUC</div>
  <div class="login-sub">Sistema de gestão financeira para coletas Shopee · Jundiaí/SP</div>
  <button class="google-btn" onclick="loginGoogle()">
    <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    Entrar com Google
  </button>
  <div class="login-version">v5.0 · Firebase Cloud Sync</div>
</div>

<!-- App -->
<div id="app">
  <!-- Sidebar desktop -->
  <div id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">
        <div class="sb-logo-box">🚛</div>
        <div><div class="sb-logo-tx">Gestão Shopee VUC</div><div class="sb-logo-sb">Jundiaí · SP</div></div>
      </div>
      <div class="sb-user">
        <div class="sb-avatar" id="sb-avatar">R</div>
        <div style="overflow:hidden">
          <div class="sb-uname" id="sb-uname">Usuário</div>
          <div class="sb-uemail" id="sb-uemail"></div>
        </div>
      </div>
    </div>
    <div class="sb-nav">
      <button class="sb-nav-item active" onclick="go('dash')" id="sb-dash"><span class="sb-nav-icon">📊</span> Painel</button>
      <button class="sb-nav-item" onclick="go('ent')" id="sb-ent"><span class="sb-nav-icon">📥</span> Entradas</button>
      <button class="sb-nav-item" onclick="go('desp')" id="sb-desp"><span class="sb-nav-icon">📤</span> Despesas</button>
      <button class="sb-nav-item" onclick="go('anal')" id="sb-anal"><span class="sb-nav-icon">🔍</span> Análise</button>
      <button class="sb-nav-item" onclick="go('fin')" id="sb-fin"><span class="sb-nav-icon">💼</span> Financeiro</button>
      <button class="sb-nav-item" onclick="go('cfg')" id="sb-cfg"><span class="sb-nav-icon">⚙️</span> Configurações</button>
    </div>
    <div class="sb-bottom">
      <div style="display:flex;align-items:center;gap:6px;padding:8px 12px;margin-bottom:6px">
        <span class="sync-dot" id="sync-dot"></span>
        <span style="font-size:11px;color:var(--t2)" id="sync-txt">Sincronizado</span>
      </div>
      <button class="sb-signout" onclick="logout()">🚪 Sair da conta</button>
    </div>
  </div>

  <!-- Mobile header -->
  <div id="mob-hdr">
    <div class="mob-logo">
      <div class="mob-logo-box">🚛</div>
      <div><div class="mob-logo-tx">Gestão Shopee VUC</div><div class="mob-logo-sb">Jundiaí · SP</div></div>
    </div>
    <div class="mob-actions">
      <span class="sync-dot" id="sync-dot-mob"></span>
      <button class="icon-btn" onclick="exportBackup()" title="Backup">💾</button>
      <button class="icon-btn" onclick="toggleTheme()">☀️</button>
    </div>
  </div>

  <!-- Content -->
  <div id="main-wrap">
    <div id="content-area">
      <div id="cnt"></div>
    </div>
  </div>

  <!-- Mobile nav -->
  <div id="mob-nav">
    <button class="nb active" onclick="go('dash')" id="nav-dash"><span class="ni">📊</span><span class="nl">Painel</span></button>
    <button class="nb" onclick="go('ent')" id="nav-ent"><span class="ni">📥</span><span class="nl">Entradas</span></button>
    <button class="nb" onclick="go('desp')" id="nav-desp"><span class="ni">📤</span><span class="nl">Despesas</span></button>
    <button class="nb" onclick="go('anal')" id="nav-anal"><span class="ni">🔍</span><span class="nl">Análise</span></button>
    <button class="nb" onclick="go('fin')" id="nav-fin"><span class="ni">💼</span><span class="nl">Financeiro</span></button>
    <button class="nb" onclick="go('cfg')" id="nav-cfg"><span class="ni">⚙️</span><span class="nl">Config</span></button>
  </div>
</div>

<!-- Modal -->
<div id="ov" onclick="closeModal()">
  <div id="mb" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="mi" id="mi"></div>
  </div>
</div>

<input type="file" id="restore-input" accept=".json" style="display:none" onchange="importBackup(this)"/>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCYjJ9qo8_rsSwIweRCJofpW-7VXDlgvU",
  authDomain: "gestao-shopee-vuc.firebaseapp.com",
  projectId: "gestao-shopee-vuc",
  storageBucket: "gestao-shopee-vuc.firebasestorage.app",
  messagingSenderId: "1056199349311",
  appId: "1:1056199349311:web:0e464180a32a3a10ef948a"
};

const fireApp  = initializeApp(firebaseConfig);
const auth     = getAuth(fireApp);
const db       = getFirestore(fireApp);
const provider = new GoogleAuthProvider();

let currentUser = null;
let unsubSnap   = null;

// ── Auth ──────────────────────────────────────────────────────────
window.loginGoogle = async () => {
  try { await signInWithPopup(auth, provider); }

// ── Firestore sync ────────────────────────────────────────────────
function subscribeData(uid){
  setSyncState('syncing');
  const ref = doc(db, 'users', uid);
  unsubSnap = onSnapshot(ref, snap => {
    if(_isSaving){ _isSaving=false; return; } // skip durante save
    if(snap.exists()){
      const remote = snap.data();
      DB.semanas   = remote.semanas   || [];
      DB.variaveis = remote.variaveis || [];
      // Merge preservando TODOS os campos do servidor, só completando campos ausentes
      const def = defCfg();
      DB.cfg = {
        ...def,
        ...remote.cfg,
        lem: {...def.lem, ...(remote.cfg?.lem||{})},
        rotas: remote.cfg?.rotas || DB.cfg?.rotas || [],
        fixasExtras: remote.cfg?.fixasExtras || [],
        alertasConcluidos: remote.cfg?.alertasConcluidos || [],
      };
    }
    setSyncState('ok');
    if(window.applyTheme) window.applyTheme();
    if(window.migrateData) window.migrateData();
    if(window.render) window.render();
  }, err => { setSyncState('error'); console.error(err); });
}

let _isSaving = false;
window.saveDB = async () => {
  if(!currentUser) return;
  _isSaving = true;
  setSyncState('syncing');
  try {
    // Snapshot dos dados no momento do save
    const dataToSave = {
      semanas:   JSON.parse(JSON.stringify(DB.semanas)),
      variaveis: JSON.parse(JSON.stringify(DB.variaveis)),
      cfg:       JSON.parse(JSON.stringify(DB.cfg))
    };
    await setDoc(doc(db,'users',currentUser.uid), dataToSave);
    setSyncState('ok');
  } catch(e){ setSyncState('error'); console.error(e); } finally { _isSaving=false; }
};

function setSyncState(state){
  const dots = [document.getElementById('sync-dot'), document.getElementById('sync-dot-mob')];
  const txt  = document.getElementById('sync-txt');
  dots.forEach(d=>{ if(!d) return; d.className='sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':''); });
  if(txt) txt.textContent = state==='syncing'?'Sincronizando...':state==='error'?'Erro ao salvar':'Sincronizado';
}

window.migrateData=function migrateData(){
  // Apenas associa rotaId - NAO recalcula valores
  const rotas=DB.cfg.rotas||[];

  let changed=false;
  DB.semanas.forEach(s=>{ if(!s.rotaId){s.rotaId=rotas[0].nome;changed=true;} });

// ═══════════ COMPUTE ══════════════════════════════════════════════
function compute(ma){
  ma=ma||curMA();
  const c=DB.cfg, semMes=DB.semanas.filter(s=>mAStr(s.data)===ma), varMes=DB.variaveis.filter(v=>mAStr(v.data)===ma);
  const recBruta=semMes.reduce((a,s)=>a+(+s.total||0),0), totPkts=semMes.reduce((a,s)=>a+(+s.pkts||0),0);
  const totDias=semMes.reduce((a,s)=>a+(+s.dias||0),0), custoMot=semMes.reduce((a,s)=>a+(+s.custoMot||0),0);
  const totalFixas=(+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
  const totalVar=varMes.reduce((a,v)=>a+(+v.valor||0),0), totalDesp=totalFixas+totalVar+custoMot;
  const lucro=recBruta-totalDesp, custoPkt=totPkts>0?totalDesp/totPkts:0;
  const semCont=semMes.length, mediaRec=semCont>0?recBruta/semCont:0, proj=mediaRec*4.3;
  return {ma,semMes,varMes,recBruta,totPkts,totDias,custoMot,totalFixas,totalVar,totalDesp,lucro,custoPkt,semCont,proj};
}
function calcSem(total,dias,pedagio,rota){
  // Usa SOMENTE valores da rota selecionada - nunca config global
  const c=DB.cfg, d=+dias||0;
  const fixoDia    = +(rota?.fixoDia)||0;
  const pedDia     = +(rota?.pedagioShopee)||0;
  const valPkt     = +c.valorPacote||0.5;
  const fixoTotal  = fixoDia*d;
  const pedShopee  = pedDia*d;
  const pedPago    = +pedagio||0;
  const valPkts    = Math.max(0,(+total||0)-fixoTotal-pedShopee);
  const pkts       = valPkt>0?Math.round(valPkts/valPkt):0;
  const sobraPed   = pedShopee-pedPago;
  const custoMot   = 0;
  const check      = Math.abs(fixoTotal+pedShopee+valPkts-(+total||0))<0.02;
  return {fixoTotal,pedShopee,pedPago,valPkts,pkts,sobraPed,custoMot,check,fixoDia,pedShopeeDia:pedDia};
}

function getAlerts(){
  const al=[],l=DB.cfg.lem||{},now=new Date(),dow=now.getDay(),dom=now.getDate(),mes=now.getMonth()+1;

  // Alertas de pagamento do motorista fixo mensal
  const rotas=DB.cfg.rotas||[];
  rotas.forEach(rota=>{
    if(rota.motTipo!=='fixo') return;
    const ma=curMA();
    const sabsNoMes=DB.semanas.filter(s=>mAStr(s.data)===ma&&s.rotaId===rota.nome&&s.teveSabado).length;
    const inc=+rota.motSabInclusos||2;
    const sabExtras=Math.max(0,sabsNoMes-inc);
    const extraVal=sabExtras*(+rota.motSabExtra||0);
    [
      {dia:+rota.motPag1Dia||5,val:+rota.motPag1Val||0},
      {dia:+rota.motPag2Dia||20,val:+rota.motPag2Val||0}
    ].forEach(pag=>{
      if(dom>=pag.dia-1&&dom<=pag.dia+1){
        const total=pag.val+extraVal;
        const quando=dom<pag.dia?'amanhã':dom===pag.dia?'hoje':'ontem';
        addAlert({tp:'a-bl',icon:'💰',title:`Pagamento motorista ${quando}! ${R$(total)}`,sub:`${rota.nome}: R$${pag.val} fixo${sabExtras>0?` + R$${extraVal} (${sabExtras} sáb. extra)`:''}` ,key:'Pagamento motorista ${quando}!'});
      }
    });
  });
  if(l.salario&&(dom>=28||dom===1)) addAlert({tp:'a-bl',icon:'💰',title:'Lembrete: Salário do Motorista',sub:dom===1?'Verifique o pagamento do motorista.':'Faltam poucos dias para o fechamento.',key:'Salario Motorista',acoes:[{label:'💰 Pago'},{label:'🙈 Ignorar'}]});
  if(l.ipva&&mes===+l.ipvaMes) addAlert({tp:'a-yw',icon:'📋',title:'IPVA vence este mês!',sub:'Providencie o pagamento do IPVA/Licenciamento.',key:'IPVA Mes',acoes:[{label:'💰 Pago'},{label:'🙈 Ignorar'}]});
  if(l.seguro&&l.seguroVenc){const venc=new Date(l.seguroVenc+'T12:00:00'),diff=Math.ceil((venc-now)/86400000);if(diff<=30&&diff>=0) addAlert({tp:'a-rd',icon:'🛡️',title:`Seguro vence em ${diff} dia(s)!`,sub:`Vencimento: ${new Date(l.seguroVenc+'T12:00:00').toLocaleDateString('pt-BR')}`,key:'Seguro Vence',acoes:[{label:'💰 Pago'},{label:'📅 Renovado'},{label:'🙈 Ignorar'}]});}
  if(l.revisao&&l.revisaoUlt){const ult=new Date(l.revisaoUlt+'T12:00:00'),prox=new Date(ult);prox.setMonth(prox.getMonth()+(+l.revisaoMeses||3));const diff=Math.ceil((prox-now)/86400000);if(diff<0) addAlert({tp:'a-rd',icon:'🔧',title:'Revisão atrasada!',sub:`Prevista: ${prox.toLocaleDateString('pt-BR')}`,key:'Revisao Atrasada',acoes:[{label:'🔧 Feita'},{label:'📅 Reagendar'},{label:'🙈 Ignorar'}]});else if(diff<=15) addAlert({tp:'a-yw',icon:'🔧',title:`Revisão em ${diff} dia(s)`,sub:`Próxima: ${prox.toLocaleDateString('pt-BR')}`,key:'Revisao Proxima',acoes:[{label:'🔧 Feita'},{label:'🙈 Ignorar'}]});}

}

// ═══════════ DASHBOARD ════════════════════════════════════════════
let dashTab = 'geral';
function computeRota(rotaNome, ma){
  ma=ma||curMA();
  const c=DB.cfg;
  const rotas=c.rotas||[];
  const sems = rotaNome==='geral'
    ? DB.semanas.filter(s=>mAStr(s.data)===ma)
    : DB.semanas.filter(s=>mAStr(s.data)===ma && (s.rotaId===rotaNome || (!s.rotaId && rotaNome===rotas[0]?.nome)));
  const varMes = DB.variaveis.filter(v=>mAStr(v.data)===ma);
  const recBruta  = sems.reduce((a,s)=>a+(+s.total||0),0);
  const totPkts   = sems.reduce((a,s)=>a+(+s.pkts||0),0);
  const totDias   = sems.reduce((a,s)=>a+(+s.dias||0),0);
  // custoMot: usa o valor salvo no lançamento (diária da rota × dias, calculado no momento do lançamento)
  // Se não tiver salvo, calcula pela rota
  const custoMot  = sems.reduce((a,s)=>{
    if(+s.custoMot>0) return a+(+s.custoMot);
    // fallback: tenta pegar diária da rota
    const rota = rotas.find(r=>r.nome===s.rotaId);
    const motDia = rota?+rota.motDiaPadrao||0:0;
    return a + motDia*(+s.dias||0);
  },0);
  const totalFixasBase=(+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
  const totalVar  = varMes.reduce((a,v)=>a+(+v.valor||0),0);

  // Calcula fixas proporcionais por dias corridos da rota no mês
  function fixasPropRota(rotaNome, ma){
    if(rotaNome==='geral') return totalFixasBase;
    const rota = rotas.find(r=>r.nome===rotaNome);
    if(!rota) return totalFixasBase;
    // Descobre dias corridos do mês
    const[mes,ano]=ma.split('/');
    const diasNoMes=new Date(+ano,+mes,0).getDate();
    const inicioMes=new Date(+ano,+mes-1,1);
    const fimMes=new Date(+ano,+mes,0);
    const inicioRota=rota.dataInicio?new Date(rota.dataInicio+'T12:00:00'):inicioMes;
    const fimRota=rota.dataFim?new Date(rota.dataFim+'T12:00:00'):fimMes;
    const inicio=inicioRota<inicioMes?inicioMes:inicioRota;
    const fim=fimRota>fimMes?fimMes:fimRota;
    const diasCorridos=Math.max(0,Math.round((fim-inicio)/86400000)+1);
    return totalFixasBase*(diasCorridos/diasNoMes);
  }

  const totalFixas = fixasPropRota(rotaNome, ma);
  const totalDesp = totalFixas+totalVar+custoMot;
  const lucro     = recBruta-totalDesp;
  const semCont   = sems.length, mediaRec=semCont>0?recBruta/semCont:0, proj=mediaRec*4.3;
  return {recBruta,totPkts,totDias,custoMot,totalFixas,totalFixasBase,totalVar,totalDesp,lucro,semCont,proj,sems,rotaNome};
}

function togAd(v){ const el=document.getElementById('wrap-ad'); if(el) el.style.display=v==='quinzenal'?'block':'none'; }
function togEqTipo(v){
  const d=document.getElementById('wrap-eq-diaria');
  const f=document.getElementById('wrap-eq-fixo');
  if(d) d.style.display=v==='fixo_mensal'?'none':'';
  if(f) f.style.display=v==='fixo_mensal'?'':'none';
}
let _modalRotaIdx=null;
function addEquipeMembro(){
  const nome=document.getElementById('eq-nome')?.value.trim();
  if(!nome){alert('Informe o nome.');return;}
  const tipo=document.getElementById('eq-tipo')?.value||'diaria';
  const m={nome,funcao:document.getElementById('eq-funcao')?.value||'motorista',tipo};
  if(tipo==='diaria') m.diaria=+document.getElementById('eq-diaria')?.value||0;
  else { m.fixoMensal=+document.getElementById('eq-fixo-val')?.value||0; m.sabInclusos=+document.getElementById('eq-sab-inc')?.value||2; m.sabExtra=+document.getElementById('eq-sab-extra')?.value||0; m.pag1Dia=+document.getElementById('eq-pag1-dia')?.value||5; m.pag1Val=+document.getElementById('eq-pag1-val')?.value||0; m.pag2Dia=+document.getElementById('eq-pag2-dia')?.value||20; m.pag2Val=+document.getElementById('eq-pag2-val')?.value||0; }
  // Find rota by name if index is unreliable
  let ri=_modalRotaIdx;
  if(ri===null||ri===undefined||!DB.cfg.rotas[ri]){
    // Try to find by name from modal
    const nomeEl=document.getElementById('rt-nome');
    if(nomeEl) ri=(DB.cfg.rotas||[]).findIndex(r=>r.nome===nomeEl.value);
  }
  if(ri<0||ri===null||!DB.cfg.rotas[ri]){ showToast('❌ Salve a rota primeiro!'); return; }
  if(!DB.cfg.rotas[ri].equipe) DB.cfg.rotas[ri].equipe=[];
  DB.cfg.rotas[ri].equipe.push(m); save();
  document.getElementById('eq-nome').value=''; document.getElementById('eq-diaria').value='';
  document.getElementById('equipe-list-modal').innerHTML=DB.cfg.rotas[ri].equipe.map((m2,i)=>`<div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:700">${m2.funcao==='motorista'?'🚗':m2.funcao==='ajudante'?'🤝':'👤'} ${m2.nome} — ${m2.funcao}</div><div style="font-size:11px;color:var(--t2)">${m2.tipo==='fixo_mensal'?'Fixo R$'+m2.fixoMensal+'/mês':'Diária R$'+m2.diaria+'/dia'}</div></div><button class="del" onclick="remEquipeMembro(${i})">🗑</button></div>`).join('');
  showToast('✅ '+m.nome+' adicionado!');
}
function remEquipeMembro(i){
  let ri=_modalRotaIdx;
  if(ri===null||ri===undefined||!DB.cfg.rotas[ri]){
    const nomeEl=document.getElementById('rt-nome');
    if(nomeEl) ri=(DB.cfg.rotas||[]).findIndex(r=>r.nome===nomeEl.value);
  }
  if(ri<0||!DB.cfg.rotas[ri]) return;
  if(!confirm('Remover este membro?')) return;
  DB.cfg.rotas[ri].equipe.splice(i,1); save();

function togDay(i){

  if(i===5) _teveSabado=btn.classList.contains('on');
  const c=DB.cfg, rota=getRotaSelecionada();
  const fixoDia = rota?+rota.fixoDia||c.fixoDia:c.fixoDia||0;
  const motDia  = rota?(+rota.motDiaPadrao||(+c.diaria||0)+(+c.valeRefeicaoDia||0)):(+c.diaria||0)+(+c.valeRefeicaoDia||0);
  const dEl=document.getElementById('dias-count'); if(dEl) dEl.textContent=selDias+' dia'+(selDias!==1?'s':'');
  const fEl=document.getElementById('dias-fixo');  if(fEl) fEl.textContent=R$(fixoDia*selDias);
  // Calculate correct motorista cost from rota
  const _rotaTD=getRotaSelecionada();
  let _motTD=0;
  if(_rotaTD?.motTipo==='fixo') _motTD=(+_rotaTD.motFixoMensal||0)/4.3;
  else _motTD=(+_rotaTD?.motDiaPadrao||0)*selDias;
  const mEl=document.getElementById('dias-mot'); if(mEl) mEl.textContent=R$(_motTD);

  document.querySelectorAll('[id^="eq-dias-"]').forEach(el=>el.value=selDias);
  prevSem();
}
function prevSem(){

  const pv=document.getElementById('ms-prev'); if(!pv)return;
  if(tot<=0){pv.style.display='none';return;}
  pv.style.display='block';
  const rotaPreview=getRotaSelecionada();
  const cx=calcSem(tot,selDias,ped,rotaPreview);
  document.getElementById('pv-tot').textContent=R$(tot);
  document.getElementById('pv-dias-txt').textContent=selDias;
  const dt2=document.getElementById('pv-dias-txt2'); if(dt2) dt2.textContent=selDias+'d';
  document.getElementById('pv-fixo').textContent='− '+R$(cx.fixoTotal);
    const rotaDisp=getRotaSelecionada();
  document.getElementById('pv-ped').textContent='− '+R$(cx.pedShopee)+' (Shopee: '+selDias+'d × '+R$(rotaDisp?.pedagioShopee||0)+')';
  document.getElementById('pv-ped-gasto').textContent=R$(cx.pedPago)+' ('+selDias+'d × '+R$(pedDia)+')';
  document.getElementById('pv-vpkt').textContent=R$(cx.valPkts);
  document.getElementById('pv-pkts').textContent=cx.pkts.toLocaleString('pt-BR')+' pacotes';
  document.getElementById('pv-sob').textContent=R$(cx.sobraPed);
  const _sob2=document.getElementById('pv-sob2'); if(_sob2) _sob2.textContent=R$(cx.sobraPed);
  // Calculate custoMot preview based on rota type
  let custoMotPreview=0;
  const rotaPrev=getRotaSelecionada();
  const equipePrev=rotaPrev?.equipe||[];
  // Sempre inclui motorista principal da rota (motTipo=fixo ou diaria)
  if(rotaPrev?.motTipo==='fixo' && rotaPrev?.motFixoMensal){
    custoMotPreview += (+rotaPrev.motFixoMensal||0)/4.3;
  } else if(rotaPrev?.motTipo==='diaria' && rotaPrev?.motDiaPadrao){
    custoMotPreview += (+rotaPrev.motDiaPadrao||0)*selDias;
  }
  // Soma equipe adicional (ajudantes, outros motoristas)
  equipePrev.forEach((m,i)=>{
    const el=document.getElementById('eq-ativo-'+i);
    if(el&&!el.checked) return;
    if(m.tipo==='fixo_mensal'){ custoMotPreview+=(+m.fixoMensal||0)/4.3; }
    else {
      const diasMem=_equipesDias[i]||[];
      if(diasMem.length>0) custoMotPreview+=(+m.diaria||0)*diasMem.length; // R$0 se nenhum dia marcado
    }
  });
  // Show detailed breakdown per member
  const pvMotDetalhe=document.getElementById('pv-mot-detalhe');
  if(pvMotDetalhe && equipePrev.length>0){
    const nomes=['Seg','Ter','Qua','Qui','Sex','Sáb'];
    let detalheHtml='';
    let totalEq=0;
    // Linha do motorista principal da rota
    if(equipePrev.length>0 && rotaPrev?.motNome){
      let custoMot=0;
      if(rotaPrev.motTipo==='fixo') custoMot=(+rotaPrev.motFixoMensal||0)/4.3;
      else custoMot=(+rotaPrev.motDiaPadrao||0)*selDias;
      if(custoMot>0){
        detalheHtml+=`<div class="crow"><span style="font-size:12px">🚗 ${rotaPrev.motNome} (motorista fixo)</span><span class="fw8 c-bl" style="font-size:12px">${R$(custoMot)}</span></div>`;
        totalEq+=custoMot;
      }
    }
    // Equipe adicional
    equipePrev.forEach((m,i)=>{
      const el=document.getElementById('eq-ativo-'+i);
      if(el&&!el.checked) return;
      let custo=0;
      if(m.tipo==='fixo_mensal'){
        custo=(+m.fixoMensal||0)/4.3;
        detalheHtml+=`<div class="crow"><span style="font-size:12px">${m.funcao==='motorista'?'🚗':'🤝'} ${m.nome} (fixo)</span><span class="fw8 c-bl" style="font-size:12px">${R$(custo)}</span></div>`;
      } else {
        const diasMem=_equipesDias[i]||[];
        const nDias=diasMem.length;
        if(nDias===0){
          detalheHtml+=`<div class="crow"><span style="font-size:12px">${m.funcao==='motorista'?'🚗':'🤝'} ${m.nome} <span style="color:var(--t2);font-size:10px">(marque os dias abaixo)</span></span><span class="fw8" style="font-size:12px;color:var(--t2)">R$ 0,00</span></div>`;
        } else {
          custo=(+m.diaria||0)*nDias;
          const diasNomes=diasMem.map(d=>nomes[d]).join(',');
          detalheHtml+=`<div class="crow"><span style="font-size:12px">${m.funcao==='motorista'?'🚗':'🤝'} ${m.nome} (${nDias}d: ${diasNomes})</span><span class="fw8 c-bl" style="font-size:12px">${R$(custo)}</span></div>`;
        }
      }
      totalEq+=custo;
    });
    pvMotDetalhe.innerHTML=`<div class="crow"><span style="font-weight:700">👥 Custo equipe</span><span id="pv-mot" class="fw8 c-bl">${R$(totalEq)}</span></div>${detalheHtml}`;
    custoMotPreview=totalEq;
  } else {
    document.getElementById('pv-mot').textContent=R$(custoMotPreview);
  }
  const chk=document.getElementById('pv-chk');
  chk.textContent=cx.check?'✔ Conta fechando corretamente':'⚠ Verifique: a soma não fecha com o total';
  chk.style.cssText=`margin-top:10px;font-size:12px;font-weight:700;text-align:center;padding:8px;border-radius:8px;background:${cx.check?'rgba(52,211,153,.1)':'rgba(244,63,94,.1)'};color:${cx.check?'var(--gn)':'var(--rd)'}`;
}
function saveSem(){
  const tot=parseFloat(document.getElementById('ms-tot')?.value)||0, pedDia=parseFloat(document.getElementById('ms-ped-dia')?.value)||0, ped=pedDia*selDias;
  const data=document.getElementById('ms-data')?.value, obs=document.getElementById('ms-obs')?.value||'';
  if(!tot){alert('Informe o valor total recebido.');return;}
  if(selDias===0){alert('Selecione ao menos um dia trabalhado.');return;}
  const rota=getRotaSelecionada();
  const cx=calcSem(tot,selDias,ped,rota);
  const rotaId=rota?.nome||'';
  // Calcula custo motorista real (diária ou fixo mensal)
  const teveSabado=_teveSabado;
  // Calcula custo da equipe
  let custoMotReal=0;
  const ma=mAStr(data);
  const equipe=rota?.equipe||[];
  if(equipe.length>0){
    equipe.forEach((m,i)=>{
      const el=document.getElementById('eq-ativo-'+i);
      if(el&&!el.checked) return;
      if(m.tipo==='fixo_mensal'){
        const sabsAnt=DB.semanas.filter(s=>mAStr(s.data)===ma&&s.rotaId===rotaId&&s.teveSabado).length;
        const isExtra=teveSabado&&sabsAnt>=(+m.sabInclusos||2);
        custoMotReal+=(+m.fixoMensal||0)/4.3+(isExtra?+m.sabExtra||0:0);
      } else {
        const diasMem=_equipesDias[i]||[];
        const nDias=diasMem.length>0?diasMem.length:0; // 0 se nenhum dia marcado
        custoMotReal+=(+m.diaria||0)*nDias;
      }
    });
  } else if(rota?.motTipo==='fixo'){
    const sabsAnt=DB.semanas.filter(s=>mAStr(s.data)===ma&&s.rotaId===rotaId&&s.teveSabado).length;
    const isExtra=teveSabado&&sabsAnt>=(+rota.motSabInclusos||2);
    custoMotReal=(+rota.motFixoMensal||0)/4.3+(isExtra?+rota.motSabExtra||0:0);
  } else {
    custoMotReal=(+rota?.motDiaPadrao||+DB.cfg.diaria||0)*selDias;
  }
  let custoMotReal_final=custoMotReal;
  // Ganhos adicionais ativados
  const rota2=getRotaSelecionada();
  let ganhoExtra=0;
  (rota2?.ganhos||[]).forEach((g,i)=>{ if(document.getElementById('ganho-ativo-'+i)?.checked) ganhoExtra+=(+g.valor||0); });
  // Captura quais dias foram selecionados em ordem
  const diasSel=[];
  document.querySelectorAll('.day-btn').forEach((b,i)=>{if(b.classList.contains('on'))diasSel.push(i);});
  const eqLog=(rota?.equipe||[]).map((m,idx2)=>{
    const atv=document.getElementById('eq-ativo-'+idx2);
    if(atv&&!atv.checked) return null;
    const dm=_equipesDias[idx2]||[];
    return {nome:m.nome,funcao:m.funcao,diasSel:dm,nDias:dm.length>0?dm.length:selDias};
  }).filter(Boolean);
  _equipesDias={};
  DB.semanas.push({id:uid(),data,total:tot+ganhoExtra,totalShopee:tot,ganhoExtra,dias:selDias,diasSelecionados:diasSel,pedDia,rotaId,teveSabado,equipeLog:eqLog,pedShopee:cx.pedShopee,pedPago:cx.pedPago,fixoTotal:cx.fixoTotal,valPkts:cx.valPkts,pkts:cx.pkts,sobraPed:cx.sobraPed,custoMot:custoMotReal_final||custoMotReal,obs,fixoDia:cx.fixoDia,pedShopeeDia:cx.pedShopeeDia,motDia:0});
  _teveSabado=false;
  save(); closeModal(); render();
}
window.editSem=id=>{
  const s=DB.semanas.find(x=>x.id===id); if(!s)return;
  // Restaura selDias
  if(s.diasSelecionados && s.diasSelecionados.length>0) selDias=s.diasSelecionados.length;
  else selDias=s.dias||5;
  // Restaura teveSabado
  _teveSabado=s.teveSabado||false;
  // Restaura dias de cada membro da equipe a partir do equipeLog
  _equipesDias={};
  const rota=(DB.cfg.rotas||[]).find(r=>r.nome===s.rotaId);
  (rota?.equipe||[]).forEach((m,i)=>{
    const log=(s.equipeLog||[]).find(l=>l.nome===m.nome);
    if(log?.diasSel && log.diasSel.length>0) _equipesDias[i]=log.diasSel;
  });
  document.getElementById('mi').innerHTML=modalSem(s);
  document.getElementById('ov').classList.add('open');
  setTimeout(()=>{
    prevSem();
    const ra2=(DB.cfg.rotas||[]).find(r=>r.nome===s.rotaId)||(DB.cfg.rotas||[]).find(r=>!r.dataFim);
    refreshEquipeModal(ra2?.nome||'');
    // After equipe renders, highlight saved days
    setTimeout(()=>{
      (rota?.equipe||[]).forEach((m,i)=>{
        const diasSalvos=_equipesDias[i]||[];
        diasSalvos.forEach(diaIdx=>{
          const btn=document.getElementById('eq-dia-'+i+'-'+diaIdx);
          if(btn){
            btn.style.borderColor='var(--ac)';

          }

        // Update resumo text

        const res=document.getElementById('eq-resumo-'+i);
        if(res && diasSalvos.length>0) res.textContent=diasSalvos.length+'d: '+diasSalvos.map(d=>nomes[d]).join(', ');
      });
    },150);
  },80);
};
window.updateSem=id=>{
  const tot=parseFloat(document.getElementById('ms-tot')?.value)||0;
  const pedDia=parseFloat(document.getElementById('ms-ped-dia')?.value)||0;
  const ped=pedDia*selDias;
  const data=document.getElementById('ms-data')?.value;
  const obs=document.getElementById('ms-obs')?.value||'';
  if(!tot){alert('Informe o valor total recebido.');return;}
  const rota=getRotaSelecionada();
  const cx=calcSem(tot,selDias,ped,rota);
  const idx=DB.semanas.findIndex(x=>x.id===id); if(idx<0)return;
  const rotaId=rota?.nome||DB.semanas[idx].rotaId||'';
  const ma2=mAStr(data);
  // Dias selecionados
  const diasSelEdit=[];
  document.querySelectorAll('.day-btn').forEach((b,i)=>{if(b.classList.contains('on'))diasSelEdit.push(i);});
  // teveSabado
  const teveSabadoUpd=_teveSabado||false;
  // Custo motorista: inclui motorista principal + equipe
  let custoMotUpd=0;
  if(rota?.motTipo==='fixo') custoMotUpd+=(+rota.motFixoMensal||0)/4.3;
  else if(rota?.motDiaPadrao) custoMotUpd+=(+rota.motDiaPadrao||0)*selDias;
  const equipeUpd=rota?.equipe||[];
  equipeUpd.forEach((m,i)=>{
    const el=document.getElementById('eq-ativo-'+i);
    if(el&&!el.checked) return;
    if(m.tipo==='fixo_mensal'){
      const sabsAnt=DB.semanas.filter(s=>mAStr(s.data)===ma2&&s.rotaId===rotaId&&s.teveSabado&&s.id!==id).length;
      const isExtra=teveSabadoUpd&&sabsAnt>=(+m.sabInclusos||2);
      custoMotUpd+=(+m.fixoMensal||0)/4.3+(isExtra?+m.sabExtra||0:0);
    } else {
      const diasMem=_equipesDias[i]||[];
      if(diasMem.length>0) custoMotUpd+=(+m.diaria||0)*diasMem.length;
    }
  });
  // equipeLog para histórico e restauração
  const eqLogUpd=equipeUpd.map((m,i)=>{
    const el=document.getElementById('eq-ativo-'+i);
    if(el&&!el.checked) return null;
    const dm=_equipesDias[i]||[];
    return {nome:m.nome,funcao:m.funcao,tipo:m.tipo,diasSel:dm,nDias:dm.length>0?dm.length:selDias};
  }).filter(Boolean);
  _equipesDias={};
  DB.semanas[idx]={...DB.semanas[idx],id,data,total:tot,dias:selDias,diasSelecionados:diasSelEdit,
    pedDia,rotaId,teveSabado:teveSabadoUpd,pedShopee:cx.pedShopee,pedPago:cx.pedPago,
    fixoTotal:cx.fixoTotal,valPkts:cx.valPkts,pkts:cx.pkts,sobraPed:cx.sobraPed,
    custoMot:custoMotUpd||cx.custoMot,obs,fixoDia:cx.fixoDia,pedShopeeDia:cx.pedShopeeDia,
    equipeLog:eqLogUpd};
  save(); closeModal(); render(); showToast('✅ Lançamento atualizado!');
};

// ═══════════ ANÁLISE ══════════════════════════════════════════════
function renderAnal(){
  const c = DB.cfg;
  const rotas = DB.cfg.rotas || [];

  // ── Dados reais por rota ──────────────────────────────────────────
  function semanasDaRota(rota){
    if(!rota.dataInicio) return DB.semanas;
    return DB.semanas.filter(s => {
      if(!s.data) return false;
      const d = s.data;
      const apos = !rota.dataInicio || d >= rota.dataInicio;
      const antes = !rota.dataFim   || d <= rota.dataFim;
      return apos && antes;
    });
  }

  function statsRota(rota){
    const sems = semanasDaRota(rota);
    if(!sems.length) return null;
    const recTotal   = sems.reduce((a,s)=>a+(+s.total||0),0);
    const pktsTotal  = sems.reduce((a,s)=>a+(+s.pkts||0),0);
    const diasTotal  = sems.reduce((a,s)=>a+(+s.dias||0),0);
    const motTotal   = sems.reduce((a,s)=>a+(+s.custoMot||0),0);
    const semanas    = sems.length;
    const recMedia   = recTotal/semanas;
    const pktsMedia  = pktsTotal/semanas;
    const diasMedia  = diasTotal/semanas;
    // Por rota individual: mostra só motorista (fixas mensais ficam no Geral)
    const despTotal  = motTotal;
    const lucroTotal = recTotal - despTotal;
    const lucroMedia = lucroTotal/semanas;
    const fixaMensal = (+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
    const fixaSem    = fixaMensal/4.3;
    const margem     = recTotal>0 ? (lucroTotal/recTotal)*100 : 0;
    // Ponto de equilíbrio
    const custoDiaMot = (+c.diaria||0)+(+c.valeRefeicaoDia||0);
    const diasMedSem  = diasMedia||5;
    const custoFixoSem   = fixaSem + custoDiaMot*diasMedSem;
    const fixoRotaSem    = (+rota.fixoDia||c.fixoDia||0)*diasMedSem;
    const pedShopeeRota  = (+rota.pedagioShopee||c.pedagioShopee||0)*diasMedSem;
    const pedGastoRota   = (+rota.pedagioDia||c.pedagioDia||0)*diasMedSem;
    const sobraPedRota   = pedShopeeRota - pedGastoRota;
    const despCobrir     = Math.max(0, custoFixoSem - fixoRotaSem - sobraPedRota);
    const minPkts        = despCobrir > 0 ? Math.ceil(despCobrir/(+c.valorPacote||0.5)) : 0;
    const minReceita  = custoFixoSem + (+rota.fixoDia||c.fixoDia||0)*diasMedSem + (+rota.pedagioShopee||c.pedagioShopee||0)*diasMedSem;
    return {recTotal,pktsTotal,diasTotal,motTotal,semanas,recMedia,pktsMedia,diasMedia,despTotal,lucroTotal,lucroMedia,margem,minPkts,fixaSem,custoFixoSem};
  }

  // ── Bloco 0: sem rotas cadastradas ───────────────────────────────
  if(rotas.length === 0){
    return `
      <div class="sh"><div class="st">🔍 Análise de Rotas</div></div>
      <div class="card" style="text-align:center;padding:32px 20px">

    const lucroSem   = recSem - despSem;

    const fixoTotalSem  = fixoDia * dias;

// ── Sync slider ↔ input ───────────────────────────────────────────
window.syncSlider = function(id, val){ const el=document.getElementById('inp-'+id); if(el) el.value=val; };
window.syncInput  = function(id, val){ const el=document.getElementById('sl-'+id);  if(el) el.value=val; };

// ── Calc simulador ────────────────────────────────────────────────
window.calcSim = function(){
  const c       = DB.cfg;
  const ri      = DB.cfg.rotaSimIdx || 0;
  const rota    = (DB.cfg.rotas||[])[ri] || {};
  const dias    = +document.getElementById('inp-dias')?.value || +document.getElementById('sl-dias')?.value || 5;
  const pkts    = +document.getElementById('inp-pkts')?.value || +document.getElementById('sl-pkts')?.value || 500;
  const pedGasto= +document.getElementById('inp-ped')?.value  || +document.getElementById('sl-ped')?.value  || 0;
  const combDia = +document.getElementById('inp-comb')?.value || +document.getElementById('sl-comb')?.value || 0;
  const motDia  = +document.getElementById('inp-mot')?.value  || +document.getElementById('sl-mot')?.value  || c.diaria||200;
  const fixoDia    = +rota.fixoDia       || c.fixoDia       || 0;
  const pedShopee  = +rota.pedagioShopee || c.pedagioShopee || 0;
  const valPacote  = +c.valorPacote      || 0.5;
  const fixaMensal = (+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
  const recSem     = fixoDia*dias + pedShopee*dias + pkts*dias*valPacote;
  const motSem     = motDia * dias; // valor total já digitado pelo usuário (inclui refeição)
  const fixaSem    = fixaMensal / 4.3;
  const combSem    = combDia * dias;
  const despSem    = motSem + fixaSem + combSem;
  const lucroSem   = recSem - despSem;
  const lucroMes   = lucroSem * 4.3;
  const sobraPed   = (pedShopee - pedGasto) * dias;
  const el  = document.getElementById('sim-lucro');
  const elm = document.getElementById('sim-lucro-mes');
  const bd  = document.getElementById('sim-breakdown');
  if(el){  el.textContent  = R$(lucroSem); el.style.color = lucroSem>=0?'var(--gn)':'var(--rd)'; }
  if(elm){ elm.textContent = R$(lucroMes); elm.style.color= lucroMes>=0?'var(--gn)':'var(--rd)'; }
  // Detalha as fixas das configurações
  const fixasDetalhadas = [
    {nome:'Financiamento/Aluguel', val:+c.financiamento||0},
    {nome:'Seguro', val:+c.seguro||0},
    ...(c.fixasExtras||[]).map(f=>({nome:f.nome,val:+f.valor||0}))
  ].filter(f=>f.val>0);

  if(bd){ bd.innerHTML = `
    <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">📥 Receita</div>
    <div class="row" style="padding:4px 0"><span style="font-size:12px">🏁 Fixo saída (${dias}d × ${R$(fixoDia)})</span><b style="color:var(--gn)">${R$(fixoDia*dias)}</b></div>
    <div class="row" style="padding:4px 0"><span style="font-size:12px">🛣️ Pedágio Shopee (${dias}d × ${R$(pedShopee)})</span><b style="color:var(--gn)">${R$(pedShopee*dias)}</b></div>
    <div class="row" style="padding:4px 0"><span style="font-size:12px">📦 Pacotes (${pkts}/dia × ${dias}d × ${R$(valPacote)})</span><b style="color:var(--gn)">${R$(pkts*dias*valPacote)}</b></div>
    ${sobraPed>0?`<div class="row" style="padding:4px 0"><span style="font-size:12px">💛 Sobra pedágio</span><b style="color:var(--yw)">${R$(sobraPed)}</b></div>`:''}
    <div class="row" style="padding:4px 0"><span style="font-size:12px;font-weight:700">💰 Total receita/sem</span><b style="color:var(--gn);font-size:14px">${R$(recSem)}</b></div>
    <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">📤 Despesas</div>
    <div class="row" style="padding:4px 0"><span style="font-size:12px">👤 Motorista (${dias}d × ${R$(motDia)})</span><b style="color:var(--bl)">${R$(motSem)}</b></div>
    <div style="font-size:11px;color:var(--t2);padding:3px 0 3px 12px">Valor total/dia já incluindo refeição</div>
    <div class="row" style="padding:4px 0"><span style="font-size:12px">📋 Fixas mensais ÷ 4,3 semanas</span><b style="color:var(--rd)">${R$(fixaSem)}</b></div>
    ${fixasDetalhadas.map(f=>`<div style="font-size:11px;color:var(--t2);padding:2px 0 2px 12px">${f.nome}: ${R$(f.val)}/mês</div>`).join('')}
    <div class="row" style="padding:6px 0;border-top:1px solid var(--bd);margin-top:4px"><span style="font-size:12px;font-weight:700">📤 Total despesas/sem</span><b style="color:var(--rd);font-size:14px">${R$(despSem)}</b></div>
  `; }
  // Update diagnostico projection cards
  const upd = (id, val, color) => { const el=document.getElementById(id); if(el){ el.textContent=R$(val); if(color) el.style.color=color; } };
  upd('dg-rec-sem',  recSem);
  upd('dg-rec-mes',  recSem*4.3);
  upd('dg-rec-ano',  recSem*52);
  upd('dg-desp-sem', despSem);
  upd('dg-desp-mes', despSem*4.3);
  upd('dg-desp-ano', despSem*52);
  upd('dg-luc-sem',  lucroSem, lucroSem>=0?'var(--gn)':'var(--rd)');
  upd('dg-luc-mes',  lucroSem*4.3, lucroSem>=0?'var(--gn)':'var(--rd)');
  upd('dg-luc-ano',  lucroSem*52,  lucroSem>=0?'var(--gn)':'var(--rd)');
  // Update min pkts equilibrio
  const fixaMesUpd   = (+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);
  const fixaUpd      = fixaMesUpd/4.3;
  const sobraPedUpd  = (pedShopee - pedGasto)*dias;
  const combUpd      = combDia*dias;
  const despCobrirUpd= Math.max(0,(fixaUpd+motSem+combUpd)-(fixoDia*dias)-sobraPedUpd);
  const minPktsUpd   = despCobrirUpd>0?Math.ceil(despCobrirUpd/(valPacote*dias||1)):0;
  const minMesUpd    = Math.ceil(minPktsUpd*4.3);
  const eqSem=document.getElementById('eq-min-sem'); if(eqSem) eqSem.textContent=minPktsUpd.toLocaleString('pt-BR');
  const eqMes=document.getElementById('eq-min-mes'); if(eqMes) eqMes.textContent=minMesUpd.toLocaleString('pt-BR');

  // Update alerts dinamicamente
  const alertasEl = document.getElementById('dg-alertas');
  if(alertasEl){
    const pctMotUpd  = recSem>0?(motSem/recSem)*100:0;
    const pctFixaUpd = recSem>0?(fixaSem/recSem)*100:0;
    const margemUpd  = recSem>0?(lucroSem/recSem)*100:0;
    const sobraUpd   = sobraPed;
    // sábado: receita extra de 1 dia
    const sabRec  = fixoDia + pedShopee + pkts*valPacote;
    const sabDesp = motDia + combDia;
    const sabVal  = sabRec - sabDesp;

    const novosAlerts = [];
    // Motorista
    if(pctMotUpd>35) novosAlerts.push({tp:'a-rd',icon:'⚠️',title:`Custo do motorista alto (${pctMotUpd.toFixed(0)}%)`,sub:`Representa ${pctMotUpd.toFixed(0)}% da receita — ideal abaixo de 35%. Reduza a diária para melhorar a margem.`});
    else novosAlerts.push({tp:'a-gn',icon:'✅',title:`Custo do motorista saudável (${pctMotUpd.toFixed(0)}%)`,sub:`Representa ${pctMotUpd.toFixed(0)}% da receita — dentro do ideal (< 35%)`});
    // Fixas
    if(pctFixaUpd>30) novosAlerts.push({tp:'a-yw',icon:'🏗️',title:`Despesas fixas pesadas (${pctFixaUpd.toFixed(0)}%)`,sub:`Fixas representam ${pctFixaUpd.toFixed(0)}% da receita semanal — avalie renegociar financiamento ou seguro`});
    else novosAlerts.push({tp:'a-gn',icon:'✅',title:`Despesas fixas sob controle (${pctFixaUpd.toFixed(0)}%)`,sub:`Fixas representam ${pctFixaUpd.toFixed(0)}% da receita semanal`});
    // Margem
    if(margemUpd<0) novosAlerts.push({tp:'a-rd',icon:'🚨',title:`Operação no prejuízo! (${margemUpd.toFixed(1)}%)`,sub:'Receita não cobre as despesas — aumente volume ou reduza custos.'});
    else if(margemUpd<10) novosAlerts.push({tp:'a-yw',icon:'📉',title:`Margem baixa (${margemUpd.toFixed(1)}%)`,sub:'Abaixo de 10% — pequena variação pode gerar prejuízo'});
    else if(margemUpd<20) novosAlerts.push({tp:'a-yw',icon:'📊',title:`Margem razoável (${margemUpd.toFixed(1)}%)`,sub:'Entre 10% e 20% — há espaço para melhorar'});
    else novosAlerts.push({tp:'a-gn',icon:'🎯',title:`Operação saudável (${margemUpd.toFixed(1)}% de margem)`,sub:'Excelente resultado — operação bem equilibrada'});
    // Pedágio
    if(sobraUpd>0) novosAlerts.push({tp:'a-gn',icon:'💛',title:`Sobra de pedágio: ${R$(sobraUpd)}/sem`,sub:`Você gasta menos pedágio do que a Shopee paga — ${R$(sobraUpd*4.3)} extras por mês`});
    else if(sobraUpd<0) novosAlerts.push({tp:'a-rd',icon:'⛽',title:`Pedágio deficitário: ${R$(Math.abs(sobraUpd))}/sem`,sub:'Você gasta mais pedágio do que a Shopee paga'});
    // Combustível
    if(combDia>0) novosAlerts.push({tp:'a-bl',icon:'⛽',title:`Combustível: ${R$(combDia*dias)}/sem`,sub:`${R$(combDia)}/dia × ${dias}d — ${R$(combDia*dias*4.3)}/mês`});
    // Sábado
    if(sabVal>0) novosAlerts.push({tp:'a-bl',icon:'📅',title:`Trabalhar sábado vale a pena!`,sub:`Cada sábado extra gera ${R$(sabVal)} de lucro adicional`});
    else novosAlerts.push({tp:'a-yw',icon:'📅',title:'Sábado não compensa neste cenário',sub:`O custo do dia extra (${R$(sabDesp)}) supera a receita extra (${R$(sabRec)})`});
    // Projeção anual
    novosAlerts.push({tp:'a-bl',icon:'💰',title:`Projeção anual: ${R$(lucroSem*52)}`,sub:`Mantendo ${pkts} pkts/dia por ${dias}d/sem — ${R$(lucroSem*4.3)} por mês`});

    alertasEl.innerHTML = novosAlerts.map(a=>`<div class="alrt ${a.tp}" style="display:flex;align-items:flex-start;gap:10px"><div class="aicon">${a.icon}</div><div style="flex:1"><div class="atitle">${a.title}</div><div class="asub">${a.sub}</div></div></div>`).join('');
  }
  // Update base info
  const baseEl = document.getElementById('dg-base');
  if(baseEl) baseEl.innerHTML = `<div style="margin-bottom:4px">📊 Base do cálculo: <b style="color:var(--tx)">${pkts} pkts/dia · ${dias} dias/sem · Motorista ${R$(motDia)}/dia · Combustível ${R$(combDia)}/dia</b></div><div style="font-size:10px;color:var(--t2)">⚡ Sliders sincronizados em tempo real</div>`;

  // Update 3 cenarios dynamically
  const grid = document.getElementById('cenarios-grid');
  if(grid){
    const pBase = pkts;
    const dBase = dias;
    const mBase = motDia;
    grid.innerHTML = [
      ['Conservador', 0.7, '#f43f5e', '🔴'],
      ['Realista',    1.0, '#fbbf24', '🟡'],
      ['Otimista',    1.3, '#34d399', '🟢'],
    ].map(([label, pct, cor, icone]) => {
      const p  = Math.round(pBase * pct);
      const r  = fixoDia*dBase + pedShopee*dBase + p*dBase*valPacote;
      const m  = (mBase+(+c.valeRefeicaoDia||0))*dBase;
      const f  = fixaMensal/4.3;
      const l  = r - m - f - cb;
      const sb = (pedShopee - pedGasto)*dBase;
      return `<div style="background:${cor}11;border:1.5px solid ${cor}44;border-radius:12px;padding:14px;text-align:center">
        <div style="font-size:18px;margin-bottom:4px">${icone}</div>
        <div style="font-size:11px;font-weight:700;color:${cor};text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${label}</div>
        <div style="font-size:11px;color:var(--t2);margin-bottom:4px">${p.toLocaleString('pt-BR')} pkts/dia · ${dBase}d</div>
        <div class="fw8" style="font-size:17px;color:${l>=0?'var(--gn)':'var(--rd)'};">${R$(l)}<span style="font-size:10px;font-weight:400;color:var(--t2)">/sem</span></div>
        <div style="font-size:11px;font-weight:700;color:${l>=0?'var(--gn)':'var(--rd)'};margin-top:3px">${R$(l*4.3)}/mês</div>
        ${sb>0?`<div style="font-size:10px;color:var(--yw);margin-top:4px">+${R$(sb)} sobra ped.</div>`:''}
      </div>`;
    }).join('');
  }
};

window.saveRota = function(idx){
  const nome  = document.getElementById('rt-nome')?.value.trim();
  if(!nome){ alert('Informe o nome da rota.'); return; }
  if(!DB.cfg.rotas) DB.cfg.rotas = [];
  const rota = {
    nome, icone: document.getElementById('rt-icon')?.value||'🗺️',
    dataInicio: document.getElementById('rt-inicio')?.value||'',
    dataFim:    document.getElementById('rt-fim')?.value||'',
    motNome:       document.getElementById('rt-mot-nome')?.value||'',
    fixoDia:       +document.getElementById('rt-fixo')?.value||0,
    pedagioShopee: +document.getElementById('rt-ped')?.value||0,
    motTipo:       document.getElementById('rt-mot-tipo')?.value||'diaria',
    motDiaPadrao:  +document.getElementById('rt-mot')?.value||0,
    motFixoMensal: +document.getElementById('rt-mot-fixo-val')?.value||0,
    motSabInclusos:+document.getElementById('rt-mot-sab-inc')?.value||2,
    motSabExtra:   +document.getElementById('rt-mot-sab-extra')?.value||0,
    motPag1Dia:    +document.getElementById('rt-mot-pag1-dia')?.value||5,
    motPag1Val:    +document.getElementById('rt-mot-pag1-val')?.value||0,
    motPag2Dia:    +document.getElementById('rt-mot-pag2-dia')?.value||20,
    motPag2Val:    +document.getElementById('rt-mot-pag2-val')?.value||0,
    pedagioDia:    +document.getElementById('rt-pedgasto')?.value||0,
    combustivelDia:+document.getElementById('rt-comb')?.value||0,
    diasPadrao:    +document.getElementById('rt-dias')?.value||5,
    pktsMediaDia:  +document.getElementById('rt-pkts')?.value||500,
  };
  // Preserva equipe e ganhos existentes ao salvar
  if(idx !== null && idx !== undefined){
    const existing = DB.cfg.rotas[idx] || {};
    rota.equipe  = existing.equipe  || [];
    rota.ganhos  = existing.ganhos  || [];
    rota.motDiaPadrao = rota.motDiaPadrao || existing.motDiaPadrao || 0;
    DB.cfg.rotas[idx] = rota;
  } else {
    rota.equipe = [];
    rota.ganhos = [];
    DB.cfg.rotas.push(rota);
  }
  save(); closeModal(); render(); showToast('✅ Rota salva!');
};
window.delRota = function(idx){
  if(!confirm('Excluir esta rota?')) return;
  DB.cfg.rotas.splice(idx,1); save(); closeModal(); render();
};
// ═══════════ RECALCULAR LANÇAMENTOS DE UMA ROTA ══════════════════
window.recalcRota = function(rotaNome){
  const rotas = DB.cfg.rotas||[];
  const rota  = rotas.find(r=>r.nome===rotaNome);
  if(!rota){ showToast('Rota não encontrada'); return; }
  if(!confirm(`Recalcular todos os lançamentos de "${rotaNome}" com:
Fixo: R$ ${rota.fixoDia}/dia
Pedágio Shopee: R$ ${rota.pedagioShopee}/dia
Motorista: R$ ${rota.motDiaPadrao||'—'}/dia

Confirma?`)) return;
  let count = 0;
  DB.semanas.forEach(s => {
    if(s.rotaId !== rotaNome) return;
    const d         = +s.dias||0;
    const fixoDia   = +rota.fixoDia||0;
    const pedShopeeDia = +rota.pedagioShopee||0;
    const motDia    = +rota.motDiaPadrao||0;
    const valPkt    = +DB.cfg.valorPacote||0.5;
    const fixoTotal = fixoDia * d;
    const pedShopee = pedShopeeDia * d;
    const pedPago   = +s.pedPago||0;
    const valPkts   = Math.max(0, (+s.total||0) - fixoTotal - pedShopee);
    const pkts      = valPkt>0 ? Math.round(valPkts/valPkt) : 0;
    const sobraPed  = pedShopee - pedPago;
    const custoMot  = motDia * d;
    s.fixoTotal   = fixoTotal;
    s.pedShopee   = pedShopee;
    s.pedShopeeDia= pedShopeeDia;
    s.valPkts     = valPkts;
    s.pkts        = pkts;
    s.sobraPed    = sobraPed;
    s.custoMot    = custoMot;
    s.fixoDia     = fixoDia;
    s.motDia      = motDia;
    count++;
  });
  save();
  render();
  showToast(`✅ ${count} lançamento(s) de "${rotaNome}" recalculados!`);
};

// ═══════════ SIMULAÇÃO MULTI-VEÍCULO ═════════════════════════════
window.calcMulti = function(){
  var fmt=function(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);};
  function gv(id){var el=document.getElementById(id);return el?parseFloat(el.value)||0:0;}

  // Mesma lógica do calcSim para cada caminhão
  function calcV(p){
    var fixoDia   = gv(p+'-fixo');
    var pedShopee = gv(p+'-ped');
    var pkts      = gv(p+'-pkts');
    var dias      = gv(p+'-dias');
    var motDia    = gv(p+'-mot');
    var combDia   = gv(p+'-diesel');
    var pedGasto  = gv(p+'-pedgasto');
    var parcela   = gv(p+'-parcela');
    // receita = fixo + pedágio Shopee + pacotes (igual calcSim)
    var recSem  = fixoDia*dias + pedShopee*dias + pkts*dias*0.5;
    // despesas = motorista + combustível + parcela/4.3 (sem pedágio gasto — vai na sobra)
    var fixaSem = parcela / 4.3;
    var motSem  = motDia * dias;
    var combSem = combDia * dias;
    var despSem = motSem + fixaSem + combSem;
    var lucSem  = recSem - despSem;
    var sobraPed = (pedShopee - pedGasto) * dias;
    return {recSem:recSem, despSem:despSem, lucSem:lucSem, lucMes:lucSem*4.3, sobraPed:sobraPed};
  }

  var c1=calcV('c1'), c2=calcV('c2');

  function sv(id,val,cor){var el=document.getElementById(id);if(el){el.textContent=fmt(val);if(cor)el.style.color=cor;}}
  sv('c1-rec',  c1.recSem,  'var(--gn)');
  sv('c1-desp', c1.despSem, 'var(--rd)');
  sv('c1-luc',  c1.lucSem,  c1.lucSem>=0?'var(--gn)':'var(--rd)');
  sv('c1-lucmes',c1.lucMes, c1.lucMes>=0?'var(--gn)':'var(--rd)');
  sv('c2-rec',  c2.recSem,  'var(--gn)');
  sv('c2-desp', c2.despSem, 'var(--rd)');
  sv('c2-luc',  c2.lucSem,  c2.lucSem>=0?'var(--gn)':'var(--rd)');
  sv('c2-lucmes',c2.lucMes, c2.lucMes>=0?'var(--gn)':'var(--rd)');

  var tRec  = (c1.recSem+c2.recSem)*4.3;
  var tDesp = (c1.despSem+c2.despSem)*4.3;
  var tLuc  = c1.lucMes+c2.lucMes;
  var tAno  = tLuc*12;
  var delta = tLuc-c1.lucMes;

  sv('tot-rec',  tRec,  'var(--gn)');
  sv('tot-desp', tDesp, 'var(--rd)');
  sv('tot-luc',  tLuc,  tLuc>=0?'var(--gn)':'var(--rd)');
  sv('tot-ano',  tAno,  tAno>=0?'var(--gn)':'var(--rd)');

  var dEl=document.getElementById('tot-delta');
  if(dEl){dEl.textContent=(delta>=0?'+':'')+fmt(delta)+'/mês';dEl.style.color=delta>=0?'var(--gn)':'var(--rd)';}

  var aEl=document.getElementById('tot-alerta');
  if(aEl){
    var pct=c1.lucMes>0?Math.round((delta/c1.lucMes)*100):0;
    if(tLuc>=0){
      aEl.style.cssText='margin-top:12px;font-size:12px;text-align:center;font-weight:600;padding:8px;border-radius:8px;background:rgba(52,211,153,.1);color:var(--gn)';
      aEl.textContent='✅ '+(pct>0?'+'+pct+'% de lucro':'')+' com 2 caminhões — '+fmt(tLuc)+'/mês vs '+fmt(c1.lucMes)+'/mês hoje';
    } else {
      aEl.style.cssText='margin-top:12px;font-size:12px;text-align:center;font-weight:600;padding:8px;border-radius:8px;background:rgba(244,63,94,.1);color:var(--rd)';
      aEl.textContent='⚠️ Operação no prejuízo — revise os valores';
    }
  }
}

let finMes = curMA();
window.setFinMes=function(ma){ finMes=ma; render(); };

// Calcula dados financeiros detalhados do mês
function calcFinanceiro(ma){
  const c=DB.cfg, rotas=c.rotas||[];
  const sems=DB.semanas.filter(s=>mAStr(s.data)===ma);
  const vars=DB.variaveis.filter(v=>mAStr(v.data)===ma);

  // ── RECEITAS ──────────────────────────────────────────────────
  const recFixo    = sems.reduce((a,s)=>a+(+s.fixoTotal||0),0);
  const recPedShop = sems.reduce((a,s)=>a+(+s.pedShopee||0),0);
  const recPacotes = sems.reduce((a,s)=>a+(+s.valPkts||0),0);
  const recSobPed  = sems.reduce((a,s)=>a+(+s.sobraPed||0),0);
  const recTotal   = sems.reduce((a,s)=>a+(+s.total||0),0);
  const totPkts    = sems.reduce((a,s)=>a+(+s.pkts||0),0);
  const totDias    = sems.reduce((a,s)=>a+(+s.dias||0),0);

  // ── DESPESAS EQUIPE ───────────────────────────────────────────
  const equipeDetalhe = {};
  rotas.forEach(rota=>{
    (rota.equipe||[]).forEach(m=>{
      if(!equipeDetalhe[m.nome]) equipeDetalhe[m.nome]={nome:m.nome,funcao:m.funcao,tipo:m.tipo,total:0};
    });
  });
  // Soma custoMot dos lançamentos por membro (aproximado pelo total)
  const custoEquipeTotal = sems.reduce((a,s)=>a+(+s.custoMot||0),0);

  // ── DESPESAS OPERACIONAIS ─────────────────────────────────────
  const pedGastoTotal = sems.reduce((a,s)=>a+(+s.pedPago||0),0);

  // ── DESPESAS VARIÁVEIS por categoria ─────────────────────────
  const varCats={};
  vars.forEach(v=>{
    if(!varCats[v.cat]) varCats[v.cat]=0;
    varCats[v.cat]+=(+v.valor||0);
  });
  const varTotal = vars.reduce((a,v)=>a+(+v.valor||0),0);

  // ── FIXAS MENSAIS ─────────────────────────────────────────────
  const fixaMensal=(+c.financiamento||0)+(+c.seguro||0)+(c.fixasExtras||[]).reduce((a,x)=>a+(+x.valor||0),0);

  // ── TOTAIS ────────────────────────────────────────────────────
  const despTotal = custoEquipeTotal + pedGastoTotal + varTotal + fixaMensal;
  const lucro     = recTotal - despTotal;
  const margem    = recTotal>0?(lucro/recTotal)*100:0;

  // ── MÊS ANTERIOR para comparativo ────────────────────────────
  const [mesN,anoN] = ma.split('/').map(Number);
  const antData = new Date(anoN, mesN-2, 1);
  const maAnt = String(antData.getMonth()+1).padStart(2,'0')+'/'+antData.getFullYear();
  const semsAnt = DB.semanas.filter(s=>mAStr(s.data)===maAnt);
  const varsAnt  = DB.variaveis.filter(v=>mAStr(v.data)===maAnt);
  const recAnt   = semsAnt.reduce((a,s)=>a+(+s.total||0),0);
  const despAntEq= semsAnt.reduce((a,s)=>a+(+s.custoMot||0),0);
  const despAntPed=semsAnt.reduce((a,s)=>a+(+s.pedPago||0),0);
  const despAntVar=varsAnt.reduce((a,v)=>a+(+v.valor||0),0);
  const despAnt  = despAntEq+despAntPed+despAntVar+fixaMensal;
  const lucroAnt = recAnt - despAnt;

  return {recFixo,recPedShop,recPacotes,recSobPed,recTotal,totPkts,totDias,
          custoEquipeTotal,pedGastoTotal,varCats,varTotal,fixaMensal,
          despTotal,lucro,margem,sems,vars,rotas,
          maAnt,recAnt,lucroAnt,equipeDetalhe};
}

function renderFin(){

  const mCur=curMA(); if(!meses.includes(mCur)) meses.unshift(mCur);
  meses.sort((a,b)=>{const[ma,ya]=a.split('/');const[mb,yb]=b.split('/');return(+yb*100+ +mb)-(+ya*100+ +ma);});
  if(!meses.includes(finMes)) finMes=meses[0]||mCur;

  const f=calcFinanceiro(finMes);
  const fixaMensal=f.fixaMensal;
  const dismissed=c.alertasConcluidos||[];
  const calDatas=c.calDatas||{};

  // ── Semana atual para resumo rápido ──────────────────────────
  const semAnt = [...DB.semanas].filter(s=>mAStr(s.data)===finMes).slice(-2);
  const recUlt = semAnt.length>0?semAnt[semAnt.length-1].total:0;
  const recPen = semAnt.length>1?semAnt[semAnt.length-2].total:0;
  const varSem = recPen>0?((recUlt-recPen)/recPen*100):0;

  // ── Calendário items ─────────────────────────────────────────
  const calItems=[];
  if(+c.financiamento>0) calItems.push({dia:calDatas.parcela_caminhao||10,desc:'🚛 Parcela caminhão',val:+c.financiamento,key:'parcela_caminhao',cor:'var(--rd)'});
  if(+c.seguro>0) calItems.push({dia:calDatas.seguro_mensal||15,desc:'🛡️ Seguro',val:+c.seguro,key:'seguro_mensal',cor:'var(--yw)'});
  (c.fixasExtras||[]).forEach((fx,i)=>calItems.push({dia:calDatas['fixa_'+i]||10,desc:'📋 '+fx.nome,val:+fx.valor,key:'fixa_'+i,cor:'var(--rd)'}));
  rotas.forEach(rota=>(rota.equipe||[]).forEach(m=>{
    if(m.tipo!=='fixo_mensal') return;
    const sabsN=DB.semanas.filter(s=>mAStr(s.data)===finMes&&s.rotaId===rota.nome&&s.teveSabado).length;
    const ext=Math.max(0,sabsN-(+m.sabInclusos||2))*(+m.sabExtra||0);
    if(m.pag1Dia) calItems.push({dia:+m.pag1Dia,desc:'💰 '+m.nome+' (1ª quinzena)',val:+m.pag1Val||0,extra:ext,key:'mot_'+m.nome+'_1',cor:'var(--bl)'});
    if(m.pag2Dia) calItems.push({dia:+m.pag2Dia,desc:'💰 '+m.nome+' (2ª quinzena)',val:+m.pag2Val||0,key:'mot_'+m.nome+'_2',cor:'var(--bl)'});
  }));
  calItems.sort((a,b)=>a.dia-b.dia);
  const calTotal=calItems.reduce((a,x)=>a+(+x.val||0)+(+x.extra||0),0);
  const calPend=calItems.filter(x=>!dismissed.includes(x.key+'_'+finMes)).reduce((a,x)=>a+(+x.val||0)+(+x.extra||0),0);

  const now=new Date(), domHoje=now.getDate();

  // ── Pizza de despesas (SVG simples) ──────────────────────────
  function pizzaSlices(dados){
    const total=dados.reduce((a,d)=>a+d.val,0); if(!total) return '';
    let ang=0, slices='', labels='';
    const cx=60,cy=60,r=55;
    dados.forEach((d,i)=>{
      const pct=d.val/total, a=pct*2*Math.PI;
      const x1=cx+r*Math.sin(ang), y1=cy-r*Math.cos(ang);
      ang+=a;
      const x2=cx+r*Math.sin(ang), y2=cy-r*Math.cos(ang);
      const lg=a>Math.PI?1:0;
      if(pct>0.01) slices+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${lg},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${d.cor}" opacity="0.85"/>`;
    });
    return `<svg viewBox="0 0 120 120" style="width:120px;height:120px">${slices}</svg>`;
  }

  const pizzaDados=[
    {nome:'Equipe',val:f.custoEquipeTotal,cor:'var(--bl)'},
    {nome:'Pedágio gasto',val:f.pedGastoTotal,cor:'var(--yw)'},
    {nome:'Variáveis',val:f.varTotal,cor:'var(--ac)'},
    {nome:'Fixas',val:f.fixaMensal,cor:'var(--rd)'},
  ].filter(d=>d.val>0);

  const sems=[...f.sems].sort((a,b)=>a.data>b.data?1:-1);

    <div class="sh">
      <div class="st">💼 Financeiro</div>
      <select class="inp" style="width:auto" onchange="setFinMes(this.value)">
        ${meses.map(m=>`<option value="${m}" ${m===finMes?'selected':''}>${mALbl(m)}</option>`).join('')}
      </select>

    <!-- Resumo rápido -->

      <div style="background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;border-left:3px solid ${f.lucro>=0?'var(--gn)':'var(--rd)'}">

        <div class="fw8" style="font-size:18px;margin:4px 0;color:${f.lucro>=f.lucroAnt?'var(--gn)':'var(--rd)'}">${f.lucroAnt!==0?((f.lucro-f.lucroAnt)/Math.abs(f.lucroAnt)*100).toFixed(1)+'%':'—'}</div>
        <div style="font-size:11px;color:var(--t2)">${mALbl(f.maAnt)}: ${R$(f.lucroAnt)}</div>

      ${(()=>{
        const equipeRows=[];
        f.rotas.forEach(rota=>{
          (rota.equipe||[]).forEach(m=>{
            const sabsN=DB.semanas.filter(s=>mAStr(s.data)===finMes&&s.rotaId===rota.nome&&s.teveSabado).length;
            const sabExt=Math.max(0,sabsN-(+m.sabInclusos||2));
            const extVal=sabExt*(+m.sabExtra||0);
            if(m.tipo==='fixo_mensal'){
              equipeRows.push(`<div class="row"><span class="rl">${m.funcao==='motorista'?'🚗':'🤝'} ${m.nome} (fixo mensal${sabExt>0?' +'+sabExt+' sáb.extra':''}) — ${rota.nome}</span><span class="rv c-bl">${R$((+m.fixoMensal||0)+extVal)}</span></div>`);
            } else {
              // Diária - estima pelos lançamentos
              equipeRows.push(`<div class="row"><span class="rl">${m.funcao==='motorista'?'🚗':'🤝'} ${m.nome} (diária R$${m.diaria}) — ${rota.nome}</span><span class="rv c-bl">ver lançamentos</span></div>`);
            }
          });
        });
        if(!equipeRows.length) return `<div class="row"><span class="rl">👥 Custo total equipe</span><span class="rv c-bl">${R$(f.custoEquipeTotal)}</span></div>`;
        return equipeRows.join('')+`<div class="row" style="background:rgba(96,165,250,.05)"><span class="rl fw8">Subtotal equipe</span><span class="rv c-bl fw8">${R$(f.custoEquipeTotal)}</span></div>`;
      })()}

      <!-- Operacionais -->
      <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px">⛽ Operacionais</div>
      <div class="row"><span class="rl">🛣️ Pedágio gasto (${f.totDias}d)</span><span class="rv c-rd">${R$(f.pedGastoTotal)}</span></div>
      ${Object.entries(f.varCats).map(([cat,val])=>`<div class="row"><span class="rl">${cat==='Combustível'?'⛽':cat==='Manutenção'?'🔧':cat==='Pneus/Peças'?'🔩':cat==='IPVA/Licenciamento'?'📋':'📌'} ${cat}</span><span class="rv c-rd">${R$(val)}</span></div>`).join('')}
      ${f.varTotal>0||f.pedGastoTotal>0?`<div class="row" style="background:rgba(244,63,94,.04)"><span class="rl fw8">Subtotal operacionais</span><span class="rv c-rd fw8">${R$(f.pedGastoTotal+f.varTotal)}</span></div>`:''}

      <!-- Fixas -->
      <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px">📋 Fixas Mensais</div>
      ${+c.financiamento>0?`<div class="row"><span class="rl">🚛 Parcela caminhão — dia ${calDatas.parcela_caminhao||10}</span><span class="rv c-rd">${R$(c.financiamento)}</span></div>`:''}
      ${+c.seguro>0?`<div class="row"><span class="rl">🛡️ Seguro — dia ${calDatas.seguro_mensal||15}</span><span class="rv c-rd">${R$(c.seguro)}</span></div>`:''}
      ${(c.fixasExtras||[]).map((fx,i)=>`<div class="row"><span class="rl">📌 ${fx.nome} — dia ${calDatas['fixa_'+i]||10}</span><span class="rv c-rd">${R$(fx.valor)}</span></div>`).join('')}

      </div>

      <!-- Lucro -->
      <div style="display:flex;justify-content:space-between;padding:12px 14px;margin-top:4px;border-radius:12px;background:${f.lucro>=0?'rgba(52,211,153,.08)':'rgba(244,63,94,.08)'};border:1px solid ${f.lucro>=0?'rgba(52,211,153,.3)':'rgba(244,63,94,.3)'}">
        <div>
          <div class="fw8 ff" style="font-size:16px">✅ Lucro Líquido</div>
          <div style="font-size:11px;color:var(--t2)">Margem ${f.margem.toFixed(1)}% · Meta >15%</div>
        </div>
        <div class="fw8 ff" style="font-size:22px;color:${f.lucro>=0?'var(--gn)':'var(--rd)'}">${R$(f.lucro)}</div>
      </div>
    </div>

    <!-- Gráfico pizza despesas -->
    ${pizzaDados.length>1?`
    <div class="card">
      <div class="ct">🥧 Composição das Despesas</div>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div style="flex-shrink:0">${pizzaSlices(pizzaDados)}</div>
        <div style="flex:1">
          ${pizzaDados.map(d=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <div style="width:12px;height:12px;border-radius:2px;background:${d.cor};flex-shrink:0"></div>
              <div style="flex:1;font-size:13px">${d.nome}</div>

              <div style="font-size:11px;color:var(--t2);min-width:40px;text-align:right">${f.despTotal>0?(d.val/f.despTotal*100).toFixed(0):'0'}%</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`:''}

    <!-- Receitas semana a semana -->
    <div class="card">
      <div class="ct">📈 Fluxo Semanal — ${mALbl(finMes)}</div>
      ${sems.length===0?`<div style="color:var(--t2);font-size:13px;text-align:center;padding:12px">Nenhum lançamento neste mês.</div>`:
        sems.map((s,i)=>`
        <div class="item">
          <div style="flex:1">
            <div class="itx">Sem ${i+1} — ${s.data} · <span style="color:var(--ac)">${s.rotaId||''}</span> · ${s.dias}d</div>
            <div class="isb">
              📦 ${(+s.pkts||0).toLocaleString('pt-BR')} pkts · ${R$(s.valPkts)}
              · 🏁 ${R$(s.fixoTotal)} · 🛣️ Ped: ${R$(s.pedShopee)}
              <br>💛 Sobra: ${R$(s.sobraPed)} · 🛣️ Gasto: ${R$(s.pedPago)}
              · 👥 Equipe: ${R$(s.custoMot)}
              ${s.teveSabado?'· <span style="color:var(--yw)">🗓️ sáb</span>':''}
              ${s.ganhoExtra?`· <span style="color:var(--gn)">+${R$(s.ganhoExtra)} extra</span>`:''}

    <!-- Comparativo mês anterior -->
    ${f.recAnt>0?`
    <div class="card">
      <div class="ct">📊 Comparativo — ${mALbl(finMes)} vs ${mALbl(f.maAnt)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center">
        <div style="background:var(--s2);border-radius:10px;padding:12px">
          <div style="font-size:10px;color:var(--t2);margin-bottom:4px">Receita</div>

          <div style="font-size:10px;color:var(--t2)">vs ${R$(f.recAnt)}</div>
          <div style="font-size:11px;font-weight:700;color:${f.recTotal>=f.recAnt?'var(--gn)':'var(--rd)'}">${f.recAnt>0?((f.recTotal-f.recAnt)/f.recAnt*100).toFixed(1)+'%':'—'}</div>
